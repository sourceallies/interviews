version: '3'
services:
  postgres:
    image: postgres:bookworm@sha256:7d2695c3aa88e792e8b3b233e7e4adb296a20412c6c0ca361e3edaaacfada108
    ports:
      - 5432:5432
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - PGDATA=/var/lib/postgresql/pgdata
    volumes:
      - ./postgres-data:/var/lib/postgresql/pgdata

  # AWS resources we use the SDK to interact with. Currently S3 & SQS
  localstack:
    image: localstack/localstack:4.14.0@sha256:3ebc37595918b8accb852f8048fef2aff047d465167edd655528065b07bc364a
    environment:
      - LOCALSTACK_SERVICES=s3,sqs
      - LS_LOG=info
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=dummyaccess
      - AWS_SECRET_ACCESS_KEY=dummysecret
      - SKIP_SSL_CERT_DOWNLOAD=1
      - SQS_ENDPOINT_STRATEGY=path
    volumes:
      - ./localstack/data:/var/lib/localstack
      - ./localstack/init.sh:/etc/localstack/init/ready.d/init.sh
    ports:
      - 4566:4566